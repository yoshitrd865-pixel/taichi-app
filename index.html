<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太極拳 級位・24式トレーニングアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col text-lg">

    <!-- Header -->
    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>🧘</span> 太極拳ナビ
            </h1>
            <div id="sync-status" class="text-xs bg-emerald-700 px-3 py-1.5 rounded-full text-emerald-100 font-medium">
                同期中...
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b border-slate-300 shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex overflow-x-auto py-1">
            <button onclick="switchTab('intro')" id="tab-intro" class="py-4 px-5 text-center font-bold text-base text-emerald-800 border-b-4 border-emerald-800 whitespace-nowrap transition">
                心構え・足形手形
            </button>
            <button onclick="switchTab('grade5')" id="tab-grade5" class="py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition">
                5級 (入門)
            </button>
            <button onclick="switchTab('grade4')" id="tab-grade4" class="py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition">
                4級 (初級)
            </button>
            <button onclick="switchTab('grade3')" id="tab-grade3" class="py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition">
                3級 (前半)
            </button>
            <button onclick="switchTab('grade2')" id="tab-grade2" class="py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition">
                2級 (後半)
            </button>
            <button onclick="switchTab('grade1')" id="tab-grade1" class="py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition">
                1級・初段 (全套路)
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 flex-grow w-full mb-16 space-y-6">
        <section id="section-intro" class="space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <h2 class="text-xl font-bold text-emerald-900 mb-4 flex items-center gap-2">
                    <span>🌟</span> 太極拳の3つのキーワード
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5" id="keywords-list"></div>
            </div>
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <h2 class="text-xl font-bold text-emerald-900 mb-2">🦶 基本の足形 (5種)</h2>
                <div id="foot-forms-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <h2 class="text-xl font-bold text-emerald-900 mb-2">✋ 基本の手形 (3種)</h2>
                <div id="hand-forms-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <section id="section-grade5" class="hidden space-y-4">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div>
                        <span class="bg-amber-100 text-amber-900 text-sm font-bold px-3 py-1 rounded-full">5級試験内容</span>
                        <h2 class="text-xl font-bold text-emerald-900 mt-2">🥋 入門太極拳</h2>
                    </div>
                    <div class="text-sm bg-slate-100 px-4 py-2 rounded-xl text-slate-700 font-bold">
                        完了: <span id="count-grade5" class="text-emerald-700 font-extrabold text-lg">0</span> / <span id="total-grade5">0</span> 式
                    </div>
                </div>
                <div id="list-grade5" class="space-y-4"></div>
            </div>
        </section>

        <section id="section-grade4" class="hidden space-y-4">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div>
                        <span class="bg-amber-100 text-amber-900 text-sm font-bold px-3 py-1 rounded-full">4級試験内容</span>
                        <h2 class="text-xl font-bold text-emerald-900 mt-2">🥋 初級太極拳</h2>
                    </div>
                    <div class="text-sm bg-slate-100 px-4 py-2 rounded-xl text-slate-700 font-bold">
                        完了: <span id="count-grade4" class="text-emerald-700 font-extrabold text-lg">0</span> / <span id="total-grade4">0</span> 式
                    </div>
                </div>
                <div id="list-grade4" class="space-y-4"></div>
            </div>
        </section>

        <section id="section-grade3" class="hidden space-y-4">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div>
                        <span class="bg-amber-100 text-amber-900 text-sm font-bold px-3 py-1 rounded-full">3級試験内容</span>
                        <h2 class="text-xl font-bold text-emerald-900 mt-2">📋 24式太極拳 前半</h2>
                    </div>
                    <div class="text-sm bg-slate-100 px-4 py-2 rounded-xl text-slate-700 font-bold">
                        完了: <span id="count-grade3" class="text-emerald-700 font-extrabold text-lg">0</span> / 13 式
                    </div>
                </div>
                <div id="list-grade3" class="space-y-4"></div>
            </div>
        </section>

        <section id="section-grade2" class="hidden space-y-4">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div>
                        <span class="bg-amber-100 text-amber-900 text-sm font-bold px-3 py-1 rounded-full">2級試験内容</span>
                        <h2 class="text-xl font-bold text-emerald-900 mt-2">📋 24式太極拳 後半</h2>
                    </div>
                    <div class="text-sm bg-slate-100 px-4 py-2 rounded-xl text-slate-700 font-bold">
                        完了: <span id="count-grade2" class="text-emerald-700 font-extrabold text-lg">0</span> / 13 式
                    </div>
                </div>
                <div id="list-grade2" class="space-y-4"></div>
            </div>
        </section>

        <section id="section-grade1" class="hidden space-y-4">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div>
                        <span class="bg-amber-100 text-amber-900 text-sm font-bold px-3 py-1 rounded-full">1級・初段試験内容</span>
                        <h2 class="text-xl font-bold text-emerald-900 mt-2">🏆 24式太極拳 全套路 (第1〜24式通し)</h2>
                    </div>
                    <div class="text-sm bg-slate-100 px-4 py-2 rounded-xl text-slate-700 font-bold">
                        完了: <span id="count-grade1" class="text-emerald-700 font-extrabold text-lg">0</span> / 24 式
                    </div>
                </div>
                <div id="list-grade1" class="space-y-4"></div>
            </div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl max-h-[92vh] overflow-y-auto rounded-3xl p-6 md:p-8 shadow-2xl relative animate-fadeIn">
            <button onclick="closeModal()" class="absolute top-5 right-5 bg-slate-100 hover:bg-slate-200 text-slate-600 w-10 h-10 rounded-full font-bold text-xl flex items-center justify-center transition">✕</button>
            <div id="modal-content" class="space-y-5"></div>
        </div>
    </div>

    <!-- Image Crop Modal -->
    <div id="crop-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 text-center">
            <h3 class="text-lg font-bold text-slate-900">📷 写真の拡大・縮小と切り取り</h3>
            <div class="relative w-full max-h-[45vh] overflow-hidden bg-black rounded-2xl flex items-center justify-center">
                <canvas id="crop-canvas" class="cursor-crosshair max-w-full"></canvas>
            </div>
            <div class="flex items-center gap-3 px-2">
                <span class="text-xs font-bold text-slate-600">小</span>
                <input type="range" id="zoom-slider" min="0.1" max="3" step="0.05" value="1" class="w-full accent-emerald-700 cursor-pointer" oninput="onZoomSlider(this.value)">
                <span class="text-xs font-bold text-slate-600">大</span>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="cancelCrop()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl font-bold">キャンセル</button>
                <button id="btn-confirm-crop" onclick="confirmCrop()" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white py-3 rounded-xl font-bold shadow">切り取って保存</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Zoom Modal -->
    <div id="zoom-modal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4" onclick="closeZoom()">
        <button onclick="closeZoom()" class="absolute top-5 right-5 bg-white/20 hover:bg-white/40 text-white w-12 h-12 rounded-full font-bold text-2xl flex items-center justify-center transition">✕</button>
        <img id="zoomed-img" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500 mt-auto">
        太極拳トレーニングアプリ &copy; 2026
    </footer>

    <script>
        const GAS_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbzm7tNt85rjGs8ge3p_57ygkp9elGxSxiEOySQZo9vTY1D2xYnqsc73Kt56yQdb-6tQVg/exec';

        const keywords = [
            { id: "kw_1", name: "調心", pinyin: "Tiáo xīn", meaning: "心の調整", desc: "無心になって動作に集中し、心を静めて意識を動作に導きます。", icon: "🧠" },
            { id: "kw_2", name: "調息", pinyin: "Tiáo xī", meaning: "呼吸の調整", desc: "深くゆったりとした腹式呼吸を行い、丹田に気を集めます。", icon: "🌬️" },
            { id: "kw_3", name: "調身", pinyin: "Tiáo shēn", meaning: "姿勢の調整", desc: "正しい姿勢で無駄な力を入れず、関節をゆるめて柔らかく動かします。", icon: "🧘" }
        ];

        const footForms = [
            { id: "foot_1", name: "馬歩", pinyin: "Mǎ bù", meaning: "乗馬立ち", desc: "両足を肩幅より広く開き、膝を曲げて腰を落とします。" },
            { id: "foot_2", name: "弓歩", pinyin: "Gōng bù", meaning: "弓の歩幅", desc: "前方に踏み出した片足を曲げて重みをかけ、後ろ足を伸ばします。" },
            { id: "foot_3", name: "虚歩", pinyin: "Xū bù", meaning: "虚の歩幅", desc: "後ろ足に100%重心を置き、前足がつま先を軽く床につけます。" },
            { id: "foot_4", name: "独立歩", pinyin: "Dú lì bù", meaning: "片足立ち", desc: "片方の膝を曲げて上げ、もう片方の足で身体を支えます。" }
        ];

        const handForms = [
            { id: "hand_1", name: "掌", pinyin: "Zhǎng", meaning: "手の平", desc: "自然に開いた手の形。あらゆる動きで最も多く使われます。" },

        const introForms = [
            { id: "i1", name: "預備式", pinyin: "Yù bèi shì", meaning: "準備姿勢", desc: "足を肩幅に開き、リラックスして立ちます。" },
            { id: "i2", name: "起勢", pinyin: "Qǐ shì", meaning: "始動の構え", desc: "手を横から上げ、体前におろします。" },
            { id: "i3", name: "手揮琵琶", pinyin: "Shǒu huī pí pá", meaning: "琵琶をかき鳴らす", desc: "虚歩で琵琶を抱く形の姿勢を作ります。" },
            { id: "i4", name: "倒巻肱", pinyin: "Dào juàn gōng", meaning: "後ろ向きに腕を巻く", desc: "後退しながら交互に腕を回す動きです。" },
            { id: "i5", name: "左右野馬分鬃", pinyin: "Zuǒ yòu yě mǎ fēn zōng", meaning: "野馬のたてがみ分ける", desc: "体をひねりながら押し出します。" },
            { id: "i6", name: "単鞭", pinyin: "Dān biān", meaning: "単鞭", desc: "片方の手でフックを作り、もう片方の手で掌を大きく押し出します。" },

            { id: "b1", name: "起勢", pinyin: "Qǐ shì", meaning: "始動の構え", desc: "腕の持ち上げと抑えを行います。" },

            { id: "b6", name: "単鞭", pinyin: "Dān biān", meaning: "単鞭", desc: "左掌は鞭を振る様に行います。" },
            { id: "b7", name: "十字手", pinyin: "Shí zì shǒu", meaning: "十字の手", desc: "斜め十字の形を作ります。" },
            { id: "b8", name: "収勢", pinyin: "Shōu shì", meaning: "収めの構え", desc: "腕内側で抑えます。" }

        const grade3Forms = [
            { id: 1, name: "起勢", pinyin: "qǐ shì", meaning: "起勢", desc: "両足を肩幅に開き、腕をゆっくり上下させて呼吸と心を落ち着かせます。" },
            { id: 2, name: "左右野馬分鬃", pinyin: "zuǒ yòu yě mǎ fēn zōng", meaning: "左右野馬分鬃", desc: "左右交互に身体をひねりながら押し出します。" },
            { id: 3, name: "白鶴亮翅", pinyin: "bái hè liàng chì", meaning: "白鶴亮翅", desc: "虚歩を作り、片腕を上で開き、もう片腕を下に構えます。" },

            { id: 8, name: "右攬雀尾", pinyin: "yòu lǎn què wěi", meaning: "右攬雀尾", desc: "右側を向いて同様に行います。" },
            { id: 9, name: "単鞭", pinyin: "dān biān", meaning: "単鞭", desc: "片方の手でフックを作り、もう片方の手で掌を大きく押し出します。" },

        const grade2Forms = [
            { id: 1, name: "高探馬", pinyin: "gāo tàn mǎ", meaning: "高探馬", desc: "虚歩になりながら、片手を前方に伸ばします。" },
            { id: 2, name: "右蹬脚", pinyin: "yòu dēng jiǎo", meaning: "右蹬脚", desc: "右足のかかとで前方を発力して蹴り出します。" },
            { id: 3, name: "双峰貫耳", pinyin: "shuāng fēng guàn ěr", meaning: "双峰貫耳", desc: "両こぶしを相手のこめかみに向かって打ち込みます。" },

            { id: 7, name: "左右穿梭", pinyin: "zuǒ yòu chuān suō", meaning: "左右穿梭", desc: "体を斜めに向けて掌で押し出します。" },
            { id: 8, name: "海底針", pinyin: "hǎi dǐ zhēn", meaning: "海底針", desc: "上体を前に倒し、下向きに突きます。" },

            { id: 10, name: "転身搬攔捶", pinyin: "zhuǎn shēn bān lán chuí", meaning: "転身搬攔捶", desc: "回転し、攻撃を受け流しながら突きます。" },

        // 高速化用ローカルキャッシュ
        let completedItems = JSON.parse(localStorage.getItem('taiji_completed_v3') || '{}');

        let formMemos = JSON.parse(localStorage.getItem('taiji_memos_v3') || '{}');

        let currentUploadUniqueId = '';
        let currentUploadGradeKey = '';
        let currentUploadItem = null;
        let cropImageObj = null;
        let cropOffset = { x: 0, y: 0 };
        let cropScale = 1;
        let isDragging = false;
        let startDrag = { x: 0, y: 0 };

        // ★ アプリ起動時にGoogleスプレッドシートからマスターデータを同期
        async function fetchMasterData() {
            const statusEl = document.getElementById('sync-status');
            if (!GAS_ENDPOINT_URL || GAS_ENDPOINT_URL.includes('YOUR_GAS')) {
                statusEl.innerText = "オフライン表示";
                return;
            }
            try {
                statusEl.innerText = "同期中...";
                const res = await fetch(GAS_ENDPOINT_URL);
                const json = await res.json();
                if (json.status === 'success' && json.data) {
                    completedItems = json.data.completed || {};
                    formImages = json.data.images || {};
                    formMemos = json.data.memos || {};

                    // ローカルキャッシュ更新
                    localStorage.setItem('taiji_completed_v3', JSON.stringify(completedItems));
                    localStorage.setItem('taiji_images_v3', JSON.stringify(formImages));
                    localStorage.setItem('taiji_memos_v3', JSON.stringify(formMemos));

                    statusEl.innerText = "クラウド同期完了";
                    renderAllLists();
                }
            } catch (err) {
                console.error("Master data fetch error:", err);
                statusEl.innerText = "キャッシュ表示中";
            }
        }

        // バックグラウンドで状態を保存
        async function saveStateToCloud(key, type, value) {
            if (!GAS_ENDPOINT_URL || GAS_ENDPOINT_URL.includes('YOUR_GAS')) return;
            try {
                await fetch(GAS_ENDPOINT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_state', key, type, value })
                });
            } catch (err) {
                console.error("Save state error:", err);
            }
        }

        function switchTab(tabId) {
            ['intro', 'grade5', 'grade4', 'grade3', 'grade2', 'grade1'].forEach(id => {
                const el = document.getElementById(`section-${id}`);
                const btn = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    el.classList.remove('hidden');
                    btn.className = "py-4 px-5 text-center font-bold text-base text-emerald-800 border-b-4 border-emerald-800 whitespace-nowrap transition";
                } else {
                    el.classList.add('hidden');
                    btn.className = "py-4 px-5 text-center font-bold text-base text-slate-600 hover:text-emerald-800 whitespace-nowrap transition";
                }
            });
            renderAllLists();
        }

        function speakChinese(text, lang = 'zh-CN') {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        function renderAllLists() {
            renderKeywordsList();
            renderBasicsList('foot-forms-list', footForms, 'foot');
            renderBasicsList('hand-forms-list', handForms, 'hand');
            renderList('grade5', introForms, 'introForms');
            renderList('grade4', basicForms, 'basicForms');
            renderList('grade3', grade3Forms, '24first');
            renderList('grade2', grade2Forms, '24second');
            renderList('grade1', grade1Forms, '24all');
        }

        function renderKeywordsList() {
            const container = document.getElementById('keywords-list');
            if (!container) return;
            container.innerHTML = "";
            keywords.forEach(item => {
                const uniqueId = `kw_${item.id}`;
                const hasImg = formImages[uniqueId] && formImages[uniqueId].length > 0;
                const hasMemo = formMemos[uniqueId] && formMemos[uniqueId].trim().length > 0;
                const card = document.createElement('div');
                card.className = "bg-emerald-50 p-5 rounded-xl border border-emerald-200 flex flex-col justify-between cursor-pointer hover:bg-emerald-100/60 transition shadow-sm";
                card.onclick = () => openDetail(uniqueId, 'intro', item);
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl">${item.icon}</span>
                            <div class="flex gap-2">
                                ${hasMemo ? '<span class="text-xs bg-amber-100 text-amber-900 px-2 py-1 rounded-full font-bold self-center">📝メモ有</span>' : ''}
                                ${hasImg ? '<span class="text-xs bg-emerald-200 text-emerald-900 px-2 py-1 rounded-full font-bold self-center">📷写真有</span>' : ''}
                                <button onclick="event.stopPropagation(); speakChinese('${item.name}')" class="text-sm bg-emerald-700 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-800 transition font-medium shadow-sm">🔊 発音</button>
                            </div>
                        </div>
                        <h3 class="font-bold text-base text-emerald-950">${item.name} (${item.meaning})</h3>
                        <p class="text-xs text-emerald-800 font-bold mb-2">${item.pinyin}</p>
                        <p class="text-sm text-slate-700 leading-relaxed">${item.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderBasicsList(containerId, dataArray, prefix) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = "";
            dataArray.forEach(item => {
                const uniqueId = `${prefix}_${item.id}`;
                const hasImg = formImages[uniqueId] && formImages[uniqueId].length > 0;
                const hasMemo = formMemos[uniqueId] && formMemos[uniqueId].trim().length > 0;
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-50 rounded-2xl border border-slate-300 flex flex-col justify-between cursor-pointer hover:bg-emerald-50/40 transition shadow-sm";
                card.onclick = () => openDetail(uniqueId, 'intro', item);
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center gap-2.5 flex-wrap">
                                <h3 class="font-bold text-lg text-slate-900">${item.name}</h3>
                                <span class="text-sm text-emerald-800 font-bold">(${item.pinyin})</span>
                                ${hasMemo ? '<span class="text-xs bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full font-bold">📝メモ有</span>' : ''}
                                ${hasImg ? '<span class="text-xs bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded-full font-bold">📷写真有</span>' : ''}
                            </div>
                            <p class="text-sm text-slate-600 mt-1">${item.meaning}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3 pt-3 border-t border-slate-200">
                        <button onclick="event.stopPropagation(); speakChinese('${item.name}')" class="flex-1 text-sm bg-emerald-700 hover:bg-emerald-800 text-white py-2 px-3 rounded-xl font-bold shadow-sm">🔊 発音を聞く</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderList(gradeKey, dataArray, prefix) {
            const listEl = document.getElementById(`list-${gradeKey}`);
            if (!listEl) return;
            listEl.innerHTML = "";
            let completedCount = 0;
            const totalEl = document.getElementById(`total-${gradeKey}`);
            if (totalEl) totalEl.innerText = dataArray.length;

            dataArray.forEach((item, index) => {
                const uniqueId = `${prefix}_${item.id}`;
                const isChecked = completedItems[uniqueId] ? 'checked' : '';
                if(isChecked) completedCount++;

                const bgClass = completedItems[uniqueId] ? 'bg-emerald-50/70 border-emerald-300' : 'bg-white border-slate-200';
                const hasImg = formImages[uniqueId] && formImages[uniqueId].length > 0;
                const hasMemo = formMemos[uniqueId] && formMemos[uniqueId].trim().length > 0;

                const card = document.createElement('div');
                card.className = `p-4 md:p-5 rounded-2xl border ${bgClass} flex items-center justify-between gap-4 transition shadow-sm`;
                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-grow cursor-pointer" onclick="openDetail('${uniqueId}', '${gradeKey}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <span class="w-10 h-10 flex-shrink-0 bg-emerald-100 text-emerald-900 font-extrabold text-base rounded-full flex items-center justify-center shadow-sm">${index + 1}</span>
                        <div>
                            <div class="flex items-center gap-2.5 flex-wrap">
                                <h3 class="font-bold text-lg text-slate-900">${item.name}</h3>
                                <span class="text-sm text-emerald-800 font-bold">(${item.pinyin})</span>
                                ${hasMemo ? '<span class="text-xs bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full font-bold">📝メモ有</span>' : ''}
                                ${hasImg ? '<span class="text-xs bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded-full font-bold">📷写真有</span>' : ''}
                            </div>
                            <p class="text-sm text-slate-600 mt-1">${item.meaning}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="event.stopPropagation(); speakChinese('${item.name}')" class="p-3 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 rounded-xl text-sm font-bold flex items-center gap-1 transition shadow-sm">🔊 発音</button>
                        <input type="checkbox" ${isChecked} onchange="toggleComplete('${uniqueId}', this.checked, '${gradeKey}')" class="w-6 h-6 text-emerald-700 rounded-md border-slate-300 focus:ring-emerald-600 cursor-pointer">
                    </div>
                `;
                listEl.appendChild(card);
            });
            const countEl = document.getElementById(`count-${gradeKey}`);
            if(countEl) countEl.innerText = completedCount;
        }

        function toggleComplete(uniqueId, status, gradeKey) {
            completedItems[uniqueId] = status;
            localStorage.setItem('taiji_completed_v3', JSON.stringify(completedItems));
            saveStateToCloud(uniqueId, 'completed', status);
            renderAllLists();
        }

        function openDetail(uniqueId, gradeKey, item) {
            const images = formImages[uniqueId] || [];
            const memoText = formMemos[uniqueId] || '';

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="bg-emerald-100 text-emerald-900 text-xs font-bold px-3 py-1.5 rounded-full">${item.name}</span>
                </div>
                <div>
                    <h3 class="text-2xl font-bold text-slate-900 mt-2">${item.name}</h3>
                    <p class="text-base text-emerald-800 font-bold mt-1">${item.pinyin || ''}</p>
                    <p class="text-sm text-slate-600 mt-1">${item.meaning ? '意味：' + item.meaning : ''}</p>
                </div>
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-base text-slate-800 leading-relaxed">
                    <strong class="block text-emerald-900 font-bold mb-2 text-lg">💡 ポイント・解説：</strong>
                    ${item.desc}
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-800 flex items-center gap-1.5">📝 先生に教わったこと・注意点メモ</label>
                    <textarea id="memo-textarea" rows="3" oninput="saveMemo('${uniqueId}', this.value)" placeholder="例：重心を低く保つ。" class="w-full text-base p-3.5 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-amber-50/30">${memoText}</textarea>
                </div>
                
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-bold text-slate-800">📷 練習写真・参考画像 (${images.length}枚)</label>
                        <label class="cursor-pointer bg-emerald-700 hover:bg-emerald-800 text-white text-sm px-4 py-2.5 rounded-xl transition shadow font-bold">
                            + 写真を追加する
                            <input type="file" accept="image/*" class="hidden" onchange="initCrop(event, '${uniqueId}', '${gradeKey}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        </label>
                    </div>
                    <div id="image-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3">
                        ${images.map((imgObj, idx) => {
                            const srcUrl = typeof imgObj === 'string' ? imgObj : imgObj.url;
                            return `
                                <div class="relative group aspect-square bg-slate-100 rounded-2xl overflow-hidden border border-slate-300 shadow-sm cursor-pointer" onclick="openZoom('${srcUrl}')">
                                    <img src="${srcUrl}" class="w-full h-full object-cover">
                                    <button onclick="event.stopPropagation(); deleteImage('${uniqueId}', ${idx}, '${gradeKey}', ${JSON.stringify(item).replace(/"/g, '&quot;')})" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white w-8 h-8 rounded-full text-sm font-bold flex items-center justify-center shadow transition">✕</button>
                                </div>
                            `;
                        }).join('')}
                        ${images.length === 0 ? '<div class="col-span-full text-center py-6 text-sm text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-300 font-medium">写真がまだ登録されていません</div>' : ''}
                    </div>
                </div>

                <div class="pt-3 flex gap-3">
                    <button onclick="speakChinese('${item.name}')" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white text-base font-bold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 transition shadow">
                        🔊 技名を聞く (${item.name})
                    </button>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        let memoTimeout = null;
        function saveMemo(uniqueId, text) {
            formMemos[uniqueId] = text;
            localStorage.setItem('taiji_memos_v3', JSON.stringify(formMemos));
            clearTimeout(memoTimeout);
            memoTimeout = setTimeout(() => {
                saveStateToCloud(uniqueId, 'memos', text);
            }, 800);
            renderAllLists();
        }

        function initCrop(event, uniqueId, gradeKey, item) {
            const file = event.target.files[0];
            if (!file) return;

            currentUploadUniqueId = uniqueId;
            currentUploadGradeKey = gradeKey;
            currentUploadItem = item;

            const reader = new FileReader();
            reader.onload = function(e) {
                cropImageObj = new Image();
                cropImageObj.onload = function() {
                    const canvas = document.getElementById('crop-canvas');
                    canvas.width = 300;
                    canvas.height = 300;
                    cropScale = Math.max(300 / cropImageObj.width, 300 / cropImageObj.height);
                    document.getElementById('zoom-slider').value = cropScale;
                    cropOffset.x = (300 - cropImageObj.width * cropScale) / 2;
                    cropOffset.y = (300 - cropImageObj.height * cropScale) / 2;
                    drawCropCanvas();
                    document.getElementById('crop-modal').classList.remove('hidden');
                };
                cropImageObj.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function onZoomSlider(val) {
            if (!cropImageObj) return;
            const oldScale = cropScale;
            cropScale = parseFloat(val);
            cropOffset.x = 150 - (150 - cropOffset.x) * (cropScale / oldScale);
            cropOffset.y = 150 - (150 - cropOffset.y) * (cropScale / oldScale);
            drawCropCanvas();
        }

        const canvas = document.getElementById('crop-canvas');
        if(canvas) {
            canvas.onmousedown = (e) => { isDragging = true; startDrag = { x: e.clientX - cropOffset.x, y: e.clientY - cropOffset.y }; };
            window.onmousemove = (e) => {
                if (!isDragging) return;
                cropOffset.x = e.clientX - startDrag.x;
                cropOffset.y = e.clientY - startDrag.y;
                drawCropCanvas();
            };
            window.onmouseup = () => { isDragging = false; };

            canvas.ontouchstart = (e) => {
                if(e.touches.length === 1) {
                    isDragging = true;
                    startDrag = { x: e.touches[0].clientX - cropOffset.x, y: e.touches[0].clientY - cropOffset.y };
                }
            };
            canvas.ontouchmove = (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                cropOffset.x = e.touches[0].clientX - startDrag.x;
                cropOffset.y = e.touches[0].clientY - startDrag.y;
                drawCropCanvas();
            };
            canvas.ontouchend = () => { isDragging = false; };
        }

        function drawCropCanvas() {
            const canvas = document.getElementById('crop-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(cropImageObj, cropOffset.x, cropOffset.y, cropImageObj.width * cropScale, cropImageObj.height * cropScale);
        }

        async function confirmCrop() {
            const canvas = document.getElementById('crop-canvas');
            const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            const btn = document.getElementById('btn-confirm-crop');
            const originalText = btn.innerText;

            try {
                btn.innerText = "ドライブに保存中...";
                btn.disabled = true;

                // 1. Googleドライブへ画像をポスト
                const response = await fetch(GAS_ENDPOINT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'upload_image',
                        image: croppedDataUrl,
                        filename: `${currentUploadUniqueId}_${Date.now()}.jpg`,
                        mimeType: 'image/jpeg'
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    if (!formImages[currentUploadUniqueId]) formImages[currentUploadUniqueId] = [];
                    
                    formImages[currentUploadUniqueId].push({
                        url: result.url,
                        fileId: result.fileId
                    });

                    localStorage.setItem('taiji_images_v3', JSON.stringify(formImages));
                    
                    // 2. クラウド（スプレッドシート）にも画像の最新リストを更新保存
                    await saveStateToCloud(currentUploadUniqueId, 'images', formImages[currentUploadUniqueId]);

                    document.getElementById('crop-modal').classList.add('hidden');
                    openDetail(currentUploadUniqueId, currentUploadGradeKey, currentUploadItem);
                    renderAllLists();
                } else {
                    alert('保存に失敗しました: ' + (result.message || '不明なエラー'));
                }
            } catch (err) {
                console.error('Fetch error:', err);
                alert('通信エラーが発生しました。');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function cancelCrop() {
            document.getElementById('crop-modal').classList.add('hidden');
        }

        function openZoom(imgSrc) {
            document.getElementById('zoomed-img').src = imgSrc;
            document.getElementById('zoom-modal').classList.remove('hidden');
        }

        function closeZoom() {
            document.getElementById('zoom-modal').classList.add('hidden');
        }

        async function deleteImage(uniqueId, imgIndex, gradeKey, item) {
            if (!confirm("この写真を削除しますか？\n（Googleドライブからも削除されます）")) return;

            const targetImage = formImages[uniqueId] ? formImages[uniqueId][imgIndex] : null;
            const fileId = targetImage && typeof targetImage === 'object' ? targetImage.fileId : null;

            if (formImages[uniqueId]) {
                formImages[uniqueId].splice(imgIndex, 1);
                localStorage.setItem('taiji_images_v3', JSON.stringify(formImages));
                openDetail(uniqueId, gradeKey, item);
                renderAllLists();
                
                // クラウド上の画像リスト更新
                saveStateToCloud(uniqueId, 'images', formImages[uniqueId]);
            }

            if (fileId && GAS_ENDPOINT_URL && !GAS_ENDPOINT_URL.includes('YOUR_GAS')) {
                try {
                    await fetch(GAS_ENDPOINT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'delete_image', fileId: fileId })
                    });
                } catch (err) {
                    console.error('Drive delete error:', err);
                }
            }
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const detailModal = document.getElementById('detail-modal');
            if (event.target === detailModal) closeModal();
        }

        // 初期化：即座に画面描画＆バックグラウンドでクラウドから最新同期
        renderAllLists();
        fetchMasterData();
    </script>
</body>
</html>
